<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galleria — Padania Tuning</title>
<link rel="icon" href="assets/img/logo.jpg">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .page-head { padding: 56px 0 30px; }
  .page-head .pt-display { margin-bottom: 18px; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .filter {
    font-family: var(--cond); font-weight: 700; font-size: 17px;
    color: var(--soft); background: var(--panel);
    border: 1px solid var(--line); border-radius: 100px;
    padding: 9px 18px; cursor: pointer; transition: all 0.2s;
  }
  .filter:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
  .filter.active { background: #fff; color: #000; border-color: #fff; }

  .albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

  .album {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 230px;
    padding: 22px;
    overflow: hidden;
    isolation: isolate;
    animation: albumIn 0.45s cubic-bezier(0.23, 1, 0.32, 1) both;
  }
  @keyframes albumIn { from { opacity: 0; transform: translateX(40px) skewX(8deg); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }

  .album-num {
    position: absolute;
    right: -6px; bottom: -28px;
    z-index: -1;
    font-family: var(--cond); font-style: italic; font-weight: 900;
    font-size: 170px; line-height: 1;
    color: transparent; -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.08);
  }
  .album-type {
    align-self: flex-start;
    font-size: 13px; font-weight: 700;
    padding: 5px 11px; border-radius: 100px;
    background: var(--pink-soft); color: #ececf0; border: 1px solid rgba(220,220,228,0.25);
  }
  .album[data-type="drift"] .album-type { background: rgba(53,224,111,0.1); color: #bff5d1; border-color: rgba(53,224,111,0.3); }
  .album[data-type="special"] .album-type { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.2); }

  .album h2 {
    font-family: var(--cond); font-style: italic; font-weight: 900;
    font-size: 36px; line-height: 0.95; text-transform: uppercase;
    margin: 18px 0 18px;
  }
  .album-links { display: grid; gap: 8px; }
  .album-links a {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-radius: 12px;
    background: var(--pink); color: var(--ink);
    text-decoration: none; font-family: var(--cond); font-weight: 800; font-size: 19px;
    transition: filter 0.2s, transform 0.12s;
  }
  .album-links a:hover { filter: brightness(1.07); }
  .album-links a:active { transform: scale(0.98); }
  .album-links small { font-family: var(--body); font-weight: 600; font-size: 13px; opacity: 0.7; }

  .share-wrap { text-align: center; margin-top: 40px; }
  .share {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line);
    color: var(--soft); padding: 12px 22px; border-radius: 100px;
    font-family: var(--body); font-size: 15px; font-weight: 600; cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .share:hover { color: #fff; border-color: rgba(255,255,255,0.3); }

  @media (max-width: 520px) {
    .page-head { padding: 36px 0 22px; }
    .albums { grid-template-columns: 1fr; gap: 12px; }
    .album { min-height: 0; padding: 18px; }
    .album h2 { font-size: 32px; margin: 14px 0 16px; }
    .album-num { font-size: 130px; bottom: -20px; }
  }
  @media (max-width: 520px) {
    .filters {
      flex-wrap: nowrap;
      overflow-x: auto;
      margin-left: -18px; margin-right: -18px;
      padding: 0 18px 4px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filters > * { flex: 0 0 auto; }
  }

</style>
</head>
<body>

<main class="pt-wrap">
  <header class="page-head">
    <h1 class="pt-display"><span>La</span><em><span>Galleria</span></em></h1>
    <p class="pt-lead">Le foto ufficiali di ogni tappa Padania Tuning, scattate dai nostri fotografi. Apri l'album e cerca la tua auto.</p>
  </header>

  <div class="filters" id="filters"></div>
  <div class="albums" id="albums"></div>

  <div class="share-wrap">
    <button class="share" type="button" id="shareBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
      <span>Condividi la galleria</span>
    </button>
  </div>
</main>

<script src="assets/js/site.js"></script>
<script>
(function () {
  /* =========================================================
     ALBUM — per aggiungerne uno copia un blocco { ... }
     tipo: 'stage' | 'special' | 'drift'
     ========================================================= */
  var ALBUM = [
    { tipo: 'stage',   titolo: 'Stage 1 — PadaniaTuning', foto: [{ label: 'Foto di Enea',    href: 'https://drive.google.com/drive/folders/1wOBG0VEXsYGXkmghEqgKlR2tAoZhYWyE' }] },
    { tipo: 'stage',   titolo: 'Stage 2 — PadaniaTuning', foto: [{ label: 'Foto di Enea',    href: 'https://drive.google.com/drive/folders/1IF2WT-NSf_EBfRCZa87I6c1Bd28GqVwL' }] },
    { tipo: 'stage',   titolo: 'Stage 3 — PadaniaTuning', foto: [{ label: 'Foto di Il Fato', href: 'https://drive.google.com/drive/folders/1JSjCVbnz3HQsowb1gMgRSxqbrkJOgWmR?usp=drive_link' }] },
    { tipo: 'special', titolo: 'Racing Meeting',          foto: [{ label: 'Foto dell\'evento', href: 'https://drive.google.com/drive/folders/1BrkTME_Bv7cJDd-F_ZC_z66287N1EmaW?usp=drive_link' }] },
    { tipo: 'drift',   titolo: 'Number One — Drift 1',    foto: [{ label: 'Foto di Il Fato', href: 'https://drive.google.com/drive/folders/1h6AhN9HtR1wsxjPs4HNHfSDZoh1QaQ6f' }] },
    { tipo: 'drift',   titolo: 'Number One — Drift 2',    foto: [{ label: 'Foto di Il Fato', href: 'https://drive.google.com/drive/folders/1FW_in6882YF8OvblCfp3vHiHEMBSam3d?usp=sharing' }] }
  ];

  var TIPI = { tutti: 'Tutti', stage: 'Tappe ufficiali', special: 'Special event', drift: 'Drift' };
  var filtri = document.getElementById('filters');
  var lista = document.getElementById('albums');

  filtri.innerHTML = Object.keys(TIPI).map(function (k) {
    return '<button type="button" class="filter" data-tipo="' + k + '">' + TIPI[k] + '</button>';
  }).join('');

  function render(tipo) {
    filtri.querySelectorAll('.filter').forEach(function (b) { b.classList.toggle('active', b.dataset.tipo === tipo); });
    lista.innerHTML = ALBUM
      .map(function (a, i) { a.n = i + 1; return a; })
      .filter(function (a) { return tipo === 'tutti' || a.tipo === tipo; })
      .map(function (a, i) {
        return '<article class="pt-card album" data-type="' + a.tipo + '" style="animation-delay:' + (i * 0.06) + 's">' +
          '<span class="album-num">' + ('0' + a.n).slice(-2) + '</span>' +
          '<div><span class="album-type">' + TIPI[a.tipo] + '</span><h2>' + a.titolo + '</h2></div>' +
          '<div class="album-links">' + a.foto.map(function (f) {
            return '<a href="' + f.href + '" target="_blank" rel="noopener">📷 ' + f.label + ' <small>Apri album →</small></a>';
          }).join('') + '</div>' +
        '</article>';
      }).join('');
  }

  filtri.addEventListener('click', function (e) { if (e.target.dataset.tipo) render(e.target.dataset.tipo); });
  render('tutti');

  // Condividi
  var shareBtn = document.getElementById('shareBtn');
  shareBtn.addEventListener('click', function () {
    if (navigator.share) {
      navigator.share({ title: 'Padania Tuning — Galleria', text: 'Guarda le foto ufficiali degli eventi Padania Tuning!', url: location.href }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(location.href).then(function () {
        var s = shareBtn.querySelector('span'); var t = s.textContent;
        s.textContent = 'Link copiato ✓';
        setTimeout(function () { s.textContent = t; }, 2000);
      });
    }
  });
})();
</script>
</body>
</html>
