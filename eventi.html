<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventi — Padania Tuning</title>
    <link rel="icon" href="assets/img/logo.jpg">
    <link rel="stylesheet" href="assets/css/site.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>  
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap');  

        /* --- ANIMAZIONI --- */  
        @keyframes fadeInUp {  
            from { 
                opacity: 0; 
                transform: translateY(30px); 
            }  
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }  
        }  

        /* Animazione di illuminazione per il bottone PadaniaTuning */
        @keyframes pulseGlow {
            0% {
                box-shadow: 
                    0 0 5px rgba(255, 255, 255, 0.4), 
                    0 0 10px rgba(255, 255, 255, 0.2);
                border-color: rgba(255, 255, 255, 0.6);
            }

            50% {
                box-shadow: 
                    0 0 15px rgba(255, 255, 255, 0.8), 
                    0 0 25px rgba(255, 255, 255, 0.4);
                border-color: rgba(255, 255, 255, 1);
            }

            100% {
                box-shadow: 
                    0 0 5px rgba(255, 255, 255, 0.4), 
                    0 0 10px rgba(255, 255, 255, 0.2);
                border-color: rgba(255, 255, 255, 0.6);
            }
        }


        .pt-modern-container {  
            font-family: 'Montserrat', sans-serif;  
            padding: 60px 15px;  
            text-align: center;  
            color: #ffffff;  
            max-width: 900px;  
            margin: 0 auto;  
        }  

        .reveal {  
            opacity: 0;  
            animation: fadeInUp 0.8s ease-out forwards;  
        }  

        .delay-1 { 
            animation-delay: 0.2s; 
        }  

        .delay-2 { 
            animation-delay: 0.4s; 
        }  

        .delay-3 { 
            animation-delay: 0.6s; 
        }  

        .delay-4 { 
            animation-delay: 0.8s; 
        }  

        /* --- TIMER --- */  
        .countdown-container {  
            margin-bottom: 15px;  
            display: block;  
        }  

        #timer {  
            font-weight: 700;  
            font-size: clamp(12px, 4vw, 16px);  
            text-transform: uppercase;  
            letter-spacing: 4px;  
            color: #ffffff;  
            opacity: 0.9;  
            min-height: 1.4em;  
        }  

        .timer-label {  
            font-weight: 400;  
            font-size: 10px;  
            letter-spacing: 5px;  
            text-transform: uppercase;  
            display: block;  
            margin-bottom: 5px;  
            opacity: 0.6;  
        }  

        .hero-title-tuning {  
            margin: 15px 0 30px 0;  
            line-height: 1.1;  
            letter-spacing: -1px;  
            text-align: center;  
            white-space: nowrap;  
        }  

        .outline-txt {  
            color: transparent;  
            -webkit-text-stroke: 1.2px #ffffff;  
            font-weight: 900;  
            font-size: clamp(28px, 8vw, 60px);  
            text-transform: uppercase;  
            display: inline-block;  
            letter-spacing: 1px;  
        }  

        .chrome-text {  
            background: linear-gradient(
                180deg, 
                #ffffff 0%, 
                #e0e0e0 40%, 
                #888888 50%, 
                #dcdcdc 60%, 
                #f5f5f5 100%
            );  
            -webkit-background-clip: text;  
            -webkit-text-fill-color: transparent;  
            font-weight: 800;  
            font-size: clamp(28px, 8vw, 60px);  
            text-transform: uppercase;  
            -webkit-text-stroke: 0.5px rgba(0,0,0,0.2);  
            display: inline-block;  
            margin-left: -2px;  
        }  

        .pt-divider-premium {  
            width: 100px;  
            height: 2px;  
            background: linear-gradient(
                90deg, 
                transparent, 
                #fff, 
                transparent
            );  
            margin: 0 auto 40px;  
        }  

        .pt-description {  
            font-size: clamp(12px, 3.5vw, 14px);  
            line-height: 1.8;  
            letter-spacing: 1.5px;  
            max-width: 550px;  
            margin: 0 auto 50px;  
            text-transform: uppercase;  
            opacity: 0.9;  
        }  

        .pt-button-wrap {  
            display: flex;  
            justify-content: center;  
            gap: 20px;  
            flex-direction: column;  
            align-items: center;  
        }  

        .pt-btn-modern {  
            position: relative;  
            text-decoration: none;  
            min-height: 75px;   
            padding: 10px 30px;  
            font-size: 11px;  
            font-weight: 900;  
            letter-spacing: 2px;  
            text-transform: uppercase;  
            transition: all 0.3s ease;  
            width: 100%;  
            max-width: 340px;  
            border-radius: 5px;  
            overflow: hidden;  
            display: flex;  
            align-items: center;  
            justify-content: center;  
            text-align: center;  
            gap: 12px;  
            box-sizing: border-box;  
            line-height: 1.4;  
        }  

        /* --- BOTTONE NERO: NOTTE BIANCA ANTEGNATE --- */
        .btn-filled {  
            background: rgba(0, 0, 0, 0.9);  
            color: #ffffff !important;  
            border: 2px solid rgba(255, 255, 255, 0.6);  
            backdrop-filter: blur(10px);
        }  

        /* --- BOTTONE BIANCO CON GLOW: PADANIA TUNING NUMBER ONE --- */
        .btn-collab {  
            background: #ffffff;  
            color: #000000 !important;  
            border: 2px solid #ffffff;
            animation: pulseGlow 1s infinite ease-in-out;
        }  

        /* Effetto luce che passa sul bottone */
        .pt-btn-modern::before {  
            content: '';  
            position: absolute;  
            top: 0;  
            left: -150%;  
            width: 100%;  
            height: 100%;  
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(255,255,255,0.2), 
                transparent
            );  
            transform: skewX(-20deg);  
            transition: 0.7s;  
        }  

        .pt-btn-modern:hover::before {  
            left: 150%;  
        }  

        .pt-btn-modern:active {  
            transform: scale(0.95);  
        }  

        @media (min-width: 768px) {  
            .pt-button-wrap {  
                flex-direction: row;  
                gap: 30px;  
            }  

            .pt-btn-modern {  
                width: 320px;  
                min-height: 80px;  
            }  

            .pt-btn-modern:hover {  
                transform: translateY(-7px);  
            }  
        }  

        @media (max-width: 600px) {  
            .pt-btn-modern {  
                width: 95%;  
                font-size: 10px;  
            }  
        }  
    </style>
</head>
<body>
<div class="pt-modern-container">  

    <!-- COUNTDOWN -->
    <div class="countdown-container reveal delay-1">
        <span class="timer-label">Chiusura iscrizioni</span>
        <div id="timer"></div>
    </div>

    <!-- TITOLO -->
    <div class="hero-title-tuning reveal delay-2">  
        <span class="outline-txt">PADANIA</span><span class="chrome-text">TUNING</span>  
    </div>  
      
    <!-- DIVISORE -->
    <div class="pt-divider-premium reveal delay-2"></div>  
      
    <!-- DESCRIZIONE -->
    <p class="pt-description reveal delay-3">  
        Benvenuto nella sezione Eventi: tramite i pulsanti dedicati puoi esporre la tua auto a un evento Padania Tuning o a un evento in collaborazione con i nostri partner.  
    </p>  

    <!-- BOTTONI -->
    <div class="pt-button-wrap reveal delay-4">  

        <!-- EVENTO PADANIA TUNING AL QI - GLOW -->
        <a href="qi.html" class="pt-btn-modern btn-collab">  
            <i class="fas fa-trophy"></i> 
            Evento PadaniaTuning al Qi
        </a>  

        <!-- EVENTI IN COLLABORAZIONE - SENZA GLOW -->
        <a href="collaborazioni.html" class="pt-btn-modern btn-filled">  
            <i class="fas fa-handshake"></i> 
            Eventi in collaborazione  
        </a>  

    </div>  

</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/site.js"></script>
<script>  
(function () {

    // La data di chiusura si cambia in assets/js/config.js (CHIUSURA_ISCRIZIONI)
    const countDownDate = new Date(window.PT_CONFIG.CHIUSURA_ISCRIZIONI).getTime();

    const timerEl = document.getElementById("timer");
    if (!timerEl) return;

    // Aggiunge lo zero davanti (es. 5 -> 05)
    function pad(n) {
        return n < 10 ? "0" + n : n;
    }

    function aggiornaTimer() {
        const now = new Date().getTime();
        const distance = countDownDate - now;

        if (distance <= 0) {
            clearInterval(x);
            timerEl.innerHTML = "ISCRIZIONI CHIUSE";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        timerEl.innerHTML =
            days + "d " +
            pad(hours) + "h " +
            pad(minutes) + "m " +
            pad(seconds) + "s";
    }

    // Parte subito, senza aspettare il primo secondo
    const x = setInterval(aggiornaTimer, 1000);
    aggiornaTimer();

})();
</script>
</body>
</html>
