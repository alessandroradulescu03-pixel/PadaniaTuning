<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventi — Padania Tuning</title>
    <link rel="icon" href="assets/img/logo.jpg">
    <link rel="stylesheet" href="assets/css/site.css">
    <style>
        .page-head { padding: 56px 0 34px; }
        .page-head .pt-display { margin: 0 0 18px; }

        .events { display: grid; gap: 22px; }

        /* Evento principale */
        .ev-cover {
            position: relative;
            min-height: 240px;
            padding: 24px 26px 28px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background:
                linear-gradient(180deg, rgba(10, 8, 12, 0.2) 0%, rgba(20, 18, 22, 0.95) 85%, var(--panel) 100%),
                url('assets/img/form-bg.jpg') center 40% / cover no-repeat;
        }
        .ev-cover .pt-pill { position: absolute; top: 22px; left: 24px; }
        .ev-cover h2 {
            font-family: var(--cond);
            font-style: italic;
            font-weight: 900;
            font-size: clamp(40px, 8vw, 68px);
            line-height: 0.9;
            text-transform: uppercase;
            margin: 40px 0 0;
        }
        .ev-cover h2 em { font-style: italic; color: transparent; -webkit-text-stroke: 1.5px var(--pink); }

        .ev-body { display: grid; grid-template-columns: 1.15fr 1fr; }
        .ev-info { padding: 26px; display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; align-content: center; }
        .ev-info .pt-perks { grid-column: 1 / -1; }
        .ev-side {
            padding: 26px;
            border-left: 2px dashed rgba(255, 255, 255, 0.12);
            display: flex; flex-direction: column; justify-content: center; gap: 16px;
        }
        .ev-side p { margin: 0; color: var(--soft); font-size: 15px; }
        .ev-side .pt-btn { width: 100%; }

        /* Collaborazioni */
        .collab {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 26px;
            text-decoration: none;
            color: var(--text);
            transition: border-color 0.2s, transform 0.2s;
        }
        .collab:hover { border-color: var(--pink-line); transform: translateY(-2px); }
        .collab b { display: block; font-family: var(--cond); font-style: italic; font-weight: 800; font-size: 32px; line-height: 1; }
        .collab span { display: block; color: var(--muted); font-size: 15px; margin-top: 6px; }
        .collab i { flex-shrink: 0; width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 22px; transition: background 0.2s, color 0.2s, border-color 0.2s; }
        .collab:hover i { background: var(--pink); color: var(--ink); border-color: var(--pink); }

        @media (max-width: 860px) {
            .ev-body { grid-template-columns: 1fr; }
            .ev-side { border-left: 0; border-top: 2px dashed rgba(255, 255, 255, 0.12); }
        }
        @media (max-width: 520px) {
            .page-head { padding: 36px 0 24px; }
            .ev-cover, .ev-info, .ev-side, .collab { padding-left: 18px; padding-right: 18px; }
            .ev-cover .pt-pill { left: 18px; }
        }
    </style>
</head>
<body>

<main class="pt-wrap">
    <header class="page-head">
        <h1 class="pt-display"><span>Eventi</span><em><span>Padania</span></em></h1>
        <p class="pt-lead">Scegli l'evento e candida la tua auto per l'area espositiva. Lo staff seleziona i mezzi e ti scrive l'esito via email.</p>
    </header>

    <div class="events">
        <article class="pt-pass">
            <div class="ev-cover">
                <span class="pt-pill"><i></i> Iscrizioni aperte</span>
                <h2 id="evTitle"></h2>
            </div>
            <div class="pt-pass-tear"></div>
            <div class="ev-body">
                <div class="ev-info">
                    <div class="pt-date" id="evDate"></div>
                    <div class="pt-where" id="evWhere"></div>
                    <ul class="pt-perks" id="evPerks"></ul>
                </div>
                <div class="ev-side">
                    <p>Chiusura iscrizioni tra</p>
                    <div class="pt-count" id="evCount"></div>
                    <a href="qi.html" class="pt-btn pt-btn-main">Candida la tua auto</a>
                </div>
            </div>
        </article>

        <a href="collaborazioni.html" class="pt-card collab">
            <div>
                <b>Eventi in collaborazione</b>
                <span>Raduni organizzati insieme ai nostri partner</span>
            </div>
            <i>→</i>
        </a>
    </div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/site.js"></script>
<script>
    var CFG = window.PT_CONFIG, EV = CFG.EVENTO;
    // Titolo: "Padania Tuning al Qi Clubbing" -> ultima parte col contorno rosa
    document.getElementById('evTitle').innerHTML = 'Padania Tuning<br><em>al ' + EV.luogo + '</em>';
    document.getElementById('evDate').innerHTML = PT.dateBox(EV.data);
    document.getElementById('evWhere').innerHTML = PT.where(EV);
    document.getElementById('evPerks').innerHTML = EV.vantaggi.map(function (v) { return '<li>' + v + '</li>'; }).join('');
    PT.countdown(document.getElementById('evCount'), CFG.CHIUSURA_ISCRIZIONI);
</script>
</body>
</html>
