<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ordine confermato — Padania Tuning</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo.jpg">
<link rel="stylesheet" href="assets/css/site.css">
<style>
.ok { max-width: 560px; margin: 0 auto; padding: 34px 16px 40px; }

.pass {
    position: relative; overflow: hidden;
    border-radius: 22px; background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 30px 60px -24px rgba(255, 255, 255, 0.18);
    animation: passIn 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
}
@keyframes passIn { from { opacity: 0; transform: translateY(24px) scale(0.97); } }
.pass-top { padding: 26px 24px 26px; background: linear-gradient(180deg, #1f1d22 0%, var(--panel) 100%); }

.check {
    width: 58px; height: 58px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 8px rgba(220, 220, 228, 0.12);
}
.check svg { width: 30px; height: 30px; }
.check path { stroke: #0a0a0a; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw 0.5s 0.4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.title { font-family: var(--cond); font-style: italic; font-weight: 900; text-transform: uppercase; font-size: clamp(42px, 12vw, 64px); line-height: 0.88; margin: 18px 0 10px; }
.title span { display: block; }
.sub { margin: 0; color: var(--soft); font-size: 15px; line-height: 1.5; }
.sub b { color: var(--text); }

.items { padding: 20px 24px 6px; }
.row { display: flex; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.row span:last-child { white-space: nowrap; font-weight: 700; }
.row.muted { color: var(--muted); font-size: 14px; }
.tot { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 24px 22px; }
.tot span { color: var(--soft); }
.tot b { font-family: var(--cond); font-style: italic; font-weight: 900; font-size: 34px; }

.note {
    display: flex; gap: 14px; align-items: flex-start;
    margin-top: 18px; padding: 16px 18px; border-radius: 16px;
    background: var(--panel); border: 1px solid var(--line);
    color: var(--soft); font-size: 14px; line-height: 1.5;
}
.note b { color: var(--text); }
.actions { display: grid; gap: 10px; margin-top: 22px; }
.actions .pt-btn { width: 100%; }

.loading { text-align: center; padding: 70px 10px; color: var(--soft); }
.spin { width: 44px; height: 44px; margin: 0 auto 18px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.15); border-top-color: #fff; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 520px) {
    .ok { padding-top: 20px; }
    .pass-top { padding: 22px 18px; }
    .items { padding: 16px 18px 4px; }
    .tot { padding: 12px 18px 20px; }
}
</style>
</head>
<body data-no-footer>

<main class="ok" id="box">
    <div class="loading"><div class="spin"></div>Sto confermando il pagamento…</div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/carrello.js"></script>
<script>
(function () {
    var CFG = window.PT_CONFIG;
    var euro = PTCart.euro;
    var box = document.getElementById('box');
    var sid = new URLSearchParams(location.search).get('session_id');

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    function mostra(o) {
        PTCart.clear();
        box.innerHTML =
            '<section class="pass">' +
                '<div class="pass-top">' +
                    '<div class="check pt-btn-main"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
                    '<h1 class="title"><span>Ordine</span><span class="chrome-t">confermato</span></h1>' +
                    '<p class="sub">Grazie <b>' + esc((o.nome || '').split(' ')[0]) + '</b>! L\'ordine <b>' + esc(o.numero) + '</b> è pagato. Ti abbiamo mandato il riepilogo a <b>' + esc(o.email) + '</b>.</p>' +
                '</div>' +
                '<div class="pt-pass-tear"></div>' +
                '<div class="items">' +
                    o.articoli.map(function (a) { return '<div class="row"><span>' + a.qta + '× ' + esc(a.nome) + '</span><span>' + euro(a.totale) + '</span></div>'; }).join('') +
                    '<div class="row muted"><span>' + esc(o.consegna) + '</span><span></span></div>' +
                '</div>' +
                '<div class="tot"><span>Totale pagato</span><b>' + euro(o.totale) + '</b></div>' +
            '</section>' +
            '<div class="note"><span>📦</span><span><b>Cosa succede ora:</b> prepariamo il tuo ordine e ti scriviamo quando parte o quando puoi ritirarlo. Per qualsiasi domanda scrivici su Instagram indicando il numero d\'ordine.</span></div>' +
            '<div class="actions">' +
                '<a href="shop.html" class="pt-btn pt-btn-main">Torna allo shop</a>' +
                '<a href="https://ig.me/m/padaniatuning" target="_blank" rel="noopener" class="pt-btn pt-btn-ghost">Scrivici su Instagram</a>' +
            '</div>';
    }

    function errore(msg) {
        box.innerHTML =
            '<section class="pass"><div class="pass-top">' +
                '<h1 class="title"><span>Quasi</span><span>fatto…</span></h1>' +
                '<p class="sub">' + esc(msg) + '</p>' +
            '</div></section>' +
            '<div class="note"><span>💳</span><span>Se hai già pagato <b>non rifare l\'ordine</b>: hai ricevuto la ricevuta di Stripe via mail e noi vediamo comunque il pagamento. Per qualsiasi dubbio scrivici su Instagram.</span></div>' +
            '<div class="actions"><a href="shop.html" class="pt-btn pt-btn-main">Torna allo shop</a>' +
            '<a href="https://ig.me/m/padaniatuning" target="_blank" rel="noopener" class="pt-btn pt-btn-ghost">Scrivici su Instagram</a></div>';
    }

    if (!sid || !CFG.SHOP_SCRIPT_URL || CFG.SHOP_SCRIPT_URL.indexOf('INCOLLA') === 0) {
        errore('Non trovo i dati dell\'ordine.');
        return;
    }

    fetch(CFG.SHOP_SCRIPT_URL + '?azione=conferma&session_id=' + encodeURIComponent(sid))
        .then(function (r) { return r.json(); })
        .then(function (res) {
            if (res.ok && res.ordine) mostra(res.ordine);
            else errore(res.error === 'Pagamento non completato' ? 'Il pagamento non risulta ancora completato.' : 'Non riesco a confermare l\'ordine in questo momento.');
        })
        .catch(function () { errore('Non riesco a confermare l\'ordine in questo momento.'); });
})();
</script>
</body>
</html>
